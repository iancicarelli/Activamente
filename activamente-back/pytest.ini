[pytest]
# `.` (rootdir = activamente-back) al PYTHONPATH para importar `app` y `tests`.
pythonpath = .
testpaths = tests
# Sin cacheprovider: .pytest_cache/ pertenece a root (lo creó Docker).
addopts = -p no:cacheprovider --strict-markers
filterwarnings =
    ignore::DeprecationWarning:passlib.*
# Capas del stack de pruebas (se asignan solas por carpeta en conftest.py):
#   pytest -m smoke        tests/smoke/      ~2 s, ¿la API arranca y responde?
#   pytest -m unit         tests/unit/       sin DB: core, schemas, helpers
#   pytest -m integration  tests/test_*.py   endpoint por endpoint contra Postgres
#   pytest -m e2e          tests/e2e/        flujos completos por rol (login real)
#   pytest -m security     tests/security/   JWT, IDOR, inyección, mass assignment, hardening
#   pytest -m live         tests/live/       contra un servidor corriendo (LIVE_API_URL); se salta si no está
markers =
    smoke: humo, rápido, sin datos nuevos
    unit: sin base de datos
    integration: un endpoint o módulo contra la DB de test
    e2e: flujo completo de negocio por rol
    security: pruebas de seguridad (authn/authz/inyección/hardening)
    live: contra un servidor real (LIVE_API_URL), no en la suite por defecto
